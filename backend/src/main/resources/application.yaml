server:
  port: ${PORT:8080}
agents:
  base-url: ${AGENTS_BASE_URL:http://localhost:8000}
  api-token: ${AGENTS_API_TOKEN:}

spring:
  application:
    name: backend
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:levelup
  jpa:
    defer-datasource-initialization: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 42MB

jwt:
  secret: ${JWT_SECRET:jwt-secret-for-development-only-123456-123456}
  expiration-minutes: 60

app:
  storage:
    location: ${APP_STORAGE_LOCATION:./uploads}
  documents:
    max-extracted-characters: 200000
  seed:
    default-users: ${APP_SEED_DEFAULT_USERS:true}