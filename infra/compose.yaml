name: level-up-dev

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: level-up-backend:dev
    ports:
      - "8080:8080"
    environment:
      AGENTS_BASE_URL: http://agents:8000
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
    restart: unless-stopped

  agents:
    build:
      context: ../agents
      dockerfile: Dockerfile
    image: level-up-agents:dev
    env_file:
      - ../.env
    restart: unless-stopped

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    image: level-up-admin:dev
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped