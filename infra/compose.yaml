name: level-up-dev

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: level-up-backend:dev
    ports:
      - "8080:8080"
    environment:
      AGENTS_BASE_URL: http://agents:8000
    restart: unless-stopped

  agents:
    build:
      context: ../agents
      dockerfile: Dockerfile
    image: level-up-agents:dev
    env_file:
      - ../.env
    restart: unless-stopped